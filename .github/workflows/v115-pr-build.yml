name: v1.1.5 PR build

on:
  push:
    branches:
      - fix/ios-native-timeline-picker-v1.1.5

permissions:
  contents: write

jobs:
  verify-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-native-timeline-picker-v1.1.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Commit generated HACS bundle
        run: |
          if git diff --quiet -- dist/sightline-for-frigate.js; then
            echo "Generated bundle already matches source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/sightline-for-frigate.js
          git commit -m "Build v1.1.5 legend filter fix"
          git push origin HEAD:fix/ios-native-timeline-picker-v1.1.5
