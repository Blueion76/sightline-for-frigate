name: Live fullscreen button verify

on:
  push:
    branches:
      - fix/live-fullscreen-button-v1.1.5

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-fullscreen-button-v1.1.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply live fullscreen fix
        run: python scripts/tmp-live-fullscreen-button.py
      - run: npm ci
      - run: npm run verify
      - name: Commit verified source and dist
        run: |
          rm scripts/tmp-live-fullscreen-button.py
          rm .github/workflows/live-fullscreen-button-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/card/live/view.js tests/v115-hardening.mjs CHANGELOG.md dist/sightline-for-frigate.js scripts/tmp-live-fullscreen-button.py .github/workflows/live-fullscreen-button-verify.yml
          git commit -m "Restore desktop Live fullscreen button"
          git push
