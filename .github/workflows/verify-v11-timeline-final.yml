name: Final timeline verification
on:
  push:
    branches: [feature/user-feedback-v1.1]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/user-feedback-v1.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run verify
