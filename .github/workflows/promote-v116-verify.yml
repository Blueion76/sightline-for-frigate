name: Promote v1.1.6 verify

on:
  push:
    branches:
      - fix/live-fullscreen-button-v1.1.5

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-fullscreen-button-v1.1.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Promote runtime and changelog to 1.1.6
        run: python scripts/tmp-promote-v116.py
      - run: npm ci
      - run: npm run verify
      - name: Commit verified v1.1.6 source and dist
        run: |
          rm scripts/tmp-promote-v116.py
          rm .github/workflows/promote-v116-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/constants.js CHANGELOG.md dist/sightline-for-frigate.js scripts/tmp-promote-v116.py .github/workflows/promote-v116-verify.yml
          git commit -m "Prepare v1.1.6"
          git push
