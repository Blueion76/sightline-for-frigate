name: Multiview full playback verify
on:
  push:
    branches:
      - fix/ios-native-timeline-picker-v1.1.5
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-native-timeline-picker-v1.1.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply playback routing patch
        run: python scripts/tmp-multiview-full-playback.py
      - run: npm ci
      - run: npm run verify
      - name: Commit verified fix and bundle
        run: |
          rm scripts/tmp-multiview-full-playback.py
          rm .github/workflows/multiview-full-playback-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/card/media/navigation.js tests/media-browser.mjs CHANGELOG.md dist/sightline-for-frigate.js scripts/tmp-multiview-full-playback.py .github/workflows/multiview-full-playback-verify.yml
          git commit -m "Use full player for Multiview clip playback"
          git push
