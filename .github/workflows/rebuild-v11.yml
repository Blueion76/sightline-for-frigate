name: Rebuild v1.1 bundle
on:
  push:
    branches: [feature/user-feedback-v1.1]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/user-feedback-v1.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run verify
      - run: |
          if git diff --quiet -- dist/sightline-for-frigate.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/sightline-for-frigate.js
          git commit -m "Build timeline UX fixes"
          git push
