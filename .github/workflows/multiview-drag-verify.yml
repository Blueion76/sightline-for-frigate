name: Multiview drag lifecycle verify

on:
  push:
    branches:
      - fix/ios-native-timeline-picker-v1.1.5

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-native-timeline-picker-v1.1.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply fix
        run: |
          echo '' | base64 -d | python
      - run: npm ci
      - run: npm run verify
      - name: Commit verified fix
        run: |
          rm .github/workflows/multiview-drag-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/card/timeline/interaction.js src/card/state.js src/card/core.js src/card/ui/playback-layout.js tests/v115-hardening.mjs tests/architecture.mjs CHANGELOG.md dist/sightline-for-frigate.js .github/workflows/multiview-drag-verify.yml
          git commit -m "Fix Multiview timeline drag after playback return"
          git push
