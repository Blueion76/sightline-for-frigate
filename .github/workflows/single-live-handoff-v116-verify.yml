name: Single live handoff v1.1.6 verify

on:
  push:
    branches:
      - fix/live-fullscreen-button-v1.1.5

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-fullscreen-button-v1.1.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply single live handoff fix
        run: python scripts/tmp-fix-single-live-handoff-v116.py
      - run: npm ci
      - run: npm run verify
      - name: Commit verified source and dist
        run: |
          rm scripts/tmp-fix-single-live-handoff-v116.py
          rm .github/workflows/single-live-handoff-v116-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/card/live/view.js src/card/multiview/controller.js tests/multiview.mjs CHANGELOG.md dist/sightline-for-frigate.js scripts/tmp-fix-single-live-handoff-v116.py .github/workflows/single-live-handoff-v116-verify.yml
          git commit -m "Fix Multiview single-camera live handoff"
          git push
