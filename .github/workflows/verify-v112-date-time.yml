name: Verify v1.1.2 date/time fixes
on:
  push:
    branches: [fix/timeline-date-time-v1.1.2]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/timeline-date-time-v1.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run verify
      - name: Commit rebuilt bundle
        run: |
          if git diff --quiet -- dist/sightline-for-frigate.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/sightline-for-frigate.js
          git commit -m "Build v1.1.2 date/time fixes"
          git push
