name: Hotfix changelog cleanup

on:
  push:
    branches:
      - fix/live-fullscreen-button-v1.1.5

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-fullscreen-button-v1.1.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/tmp-move-live-fullscreen-changelog.py
      - run: npm ci
      - run: npm run verify
      - name: Commit cleaned changelog
        run: |
          rm scripts/tmp-move-live-fullscreen-changelog.py
          rm .github/workflows/hotfix-changelog-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md dist/sightline-for-frigate.js scripts/tmp-move-live-fullscreen-changelog.py .github/workflows/hotfix-changelog-cleanup.yml
          git commit -m "Move live fullscreen fix to Unreleased changelog"
          git push
