name: Wide playback layout verify

on:
  push:
    branches:
      - fix/ios-native-timeline-picker-v1.1.5

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-native-timeline-picker-v1.1.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add regression coverage and changelog entry
        run: python scripts/tmp-wide-playback-layout-test.py
      - run: npm ci
      - run: npm run verify
      - name: Commit verified fix and bundle
        run: |
          rm scripts/tmp-wide-playback-layout-test.py
          rm .github/workflows/wide-playback-layout-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/responsive-layout.mjs tests/media-browser.mjs CHANGELOG.md dist/sightline-for-frigate.js scripts/tmp-wide-playback-layout-test.py .github/workflows/wide-playback-layout-verify.yml
          git commit -m "Fix blank space in wide Multiview clip playback"
          git push
